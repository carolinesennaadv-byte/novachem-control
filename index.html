<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaLogis - Control Nexus</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase (Apenas Base de Dados e Autenticação) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>

    <!-- Bibliotecas para PDF e Excel -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }

</head>
<body class="bg-[#050508] text-slate-200 antialiased selection:bg-cyan-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;

        // === CONFIGURAÇÃO FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyDfL15pq1lSAdAGPUKMZAw7x90COkCHVfY",
            authDomain: "novachem-95766.firebaseapp.com",
            projectId: "novachem-95766",
            storageBucket: "novachem-95766.firebasestorage.app",
            messagingSenderId: "209968061781",
            appId: "1:209968061781:web:4cd9f96cab03965f01a3dc"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // === ÍCONES ===
        const iconPaths = {
            ShieldAlert: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4M12 16h.01"/>,
            LayoutDashboard: <><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></>,
            LogOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>,
            Plus: <path d="M5 12h14M12 5v14"/>,
            CheckCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
            AlertTriangle: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4M12 17h.01"/>,
            Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
            ArrowRightLeft: <path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>,
            UserIcon: <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>,
            Lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
            Unlock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>,
            Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56"/>,
            FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>,
            FileSpreadsheet: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></>,
            Truck: <><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>,
            History: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>,
            Edit2: <><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></>,
            Trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
            XCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>,
            Paperclip: <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>,
            ExternalLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>
        };

        const Icon = ({ name, size = 18, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {iconPaths[name]}
            </svg>
        );

        // === CONTEXTO DE AUTENTICAÇÃO ===
        const AuthContext = createContext({});

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isInitializing, setIsInitializing] = useState(true);
            const [authError, setAuthError] = useState(null);

            // SENHA MESTRA DO ADMINISTRADOR
            const MASTER_ADMIN_PASSWORD = "NOVALOGIS2026";

            const enableAdmin = (pwd) => {
                if(pwd === MASTER_ADMIN_PASSWORD) {
                    setIsAdmin(true);
                    return true;
                }
                return false;
            };

            const disableAdmin = () => setIsAdmin(false);

            useEffect(() => {
                const timeout = setTimeout(() => {
                    if (isInitializing) {
                        setAuthError("Tempo de conexão esgotado. Verifique a internet ou bloqueios do navegador.");
                        setIsInitializing(false);
                    }
                }, 4000);

                try {
                    const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        setIsAdmin(false);
                        setIsInitializing(false);
                        clearTimeout(timeout);
                    }, (error) => {
                        setAuthError(error.message);
                        setIsInitializing(false);
                        clearTimeout(timeout);
                    });
                    return () => { unsubscribe(); clearTimeout(timeout); };
                } catch (error) {
                    setAuthError(error.message); setIsInitializing(false); clearTimeout(timeout);
                }
            }, []);

            const login = async (email, password) => auth.signInWithEmailAndPassword(email, password);
            const register = async (email, password) => auth.createUserWithEmailAndPassword(email, password);
            const loginWithGoogle = async () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
            const logout = async () => auth.signOut();

            if (authError) {
                return (
                    <div className="min-h-screen bg-[#050508] flex items-center justify-center p-4">
                        <div className="bg-[#0f1016]/80 border border-rose-500/30 p-8 rounded-2xl max-w-lg text-center shadow-[0_0_30px_rgba(244,63,94,0.15)] relative overflow-hidden">
                            <Icon name="AlertTriangle" size={48} className="text-rose-500 mx-auto mb-4 relative z-10" />
                            <h2 className="text-xl font-bold text-white mb-3 relative z-10">Erro de Segurança</h2>
                            <p className="text-slate-400 text-sm mb-6 relative z-10">{authError}</p>
                        </div>
                    </div>
                );
            }

            if (isInitializing) return (
                <div className="min-h-screen bg-[#050508] flex flex-col items-center justify-center">
                    <Icon name="Loader2" size={48} className="text-cyan-500 animate-spin mb-6" />
                    <h1 className="text-2xl font-black text-white tracking-tighter uppercase animate-pulse">Iniciando NovaLogis...</h1>
                </div>
            );

            return (
                <AuthContext.Provider value={{ user, isAdmin, enableAdmin, disableAdmin, uiLoggedIn: !!user, login, register, loginWithGoogle, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        // === COMPONENTES VISUAIS ===
        const Card = ({ children, className = '', glowColor = 'none' }) => {
            const glows = {
                none: 'border-white/5',
                purple: 'border-purple-500/30 hover:shadow-[0_0_20px_rgba(168,85,247,0.15)] hover:border-purple-500/50',
                cyan: 'border-cyan-500/30 hover:shadow-[0_0_20px_rgba(6,182,212,0.15)] hover:border-cyan-500/50',
                rose: 'border-rose-500/30 hover:shadow-[0_0_20px_rgba(244,63,94,0.15)] hover:border-rose-500/50',
            };
            return <div className={`bg-[#0f1016]/80 backdrop-blur-xl border rounded-2xl transition-all duration-300 ${glows[glowColor]} ${className}`}>{children}</div>;
        };

        const Button = ({ children, variant = 'primary', isLoading, onClick, className = '', type = 'button' }) => {
            const variants = {
                primary: "bg-purple-600 hover:bg-purple-500 text-white shadow-[0_0_15px_rgba(147,51,234,0.4)]",
                secondary: "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700",
                cyan: "bg-cyan-600 hover:bg-cyan-500 text-white shadow-[0_0_15px_rgba(8,145,178,0.4)]",
                red: "bg-rose-600 hover:bg-rose-500 text-white shadow-[0_0_15px_rgba(244,63,94,0.4)]",
                green: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]",
                ghost: "bg-transparent hover:bg-white/10 text-slate-400 hover:text-white"
            };
            return (
                <button type={type} onClick={onClick} disabled={isLoading} className={`flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all ${variants[variant]} ${className}`}>
                    {isLoading ? <Icon name="Loader2" size={18} className="animate-spin mr-2" /> : null}
                    {children}
                </button>
            );
        };

        const NeonBadge = ({ text, type = 'default' }) => {
            const styles = {
                danger: 'bg-rose-500/10 text-rose-400 border-rose-500/50',
                warning: 'bg-amber-500/10 text-amber-400 border-amber-500/50',
                success: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/50',
                cyan: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/50',
                default: 'bg-purple-500/10 text-purple-400 border-purple-500/50',
            };
            return <span className={`flex items-center px-2.5 py-1 rounded-full text-xs font-medium border ${styles[type]}`}>{text}</span>;
        };

        // === ECRÃ DE LOGIN ===
        const LoginScreen = () => {
            const { login, register, loginWithGoogle } = useContext(AuthContext);
            const [isRegistering, setIsRegistering] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isGoogleLoading, setIsGoogleLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault(); setIsLoading(true); setError('');
                try { 
                    if (isRegistering) {
                        if (password !== confirmPassword) { setError('As senhas não coincidem.'); setIsLoading(false); return; }
                        await register(email, password);
                    } else {
                        await login(email, password); 
                    }
                } 
                catch (err) { 
                    if (err.code === 'auth/email-already-in-use') setError('Este email já está registrado.');
                    else if (err.code === 'auth/weak-password') setError('A senha deve ter pelo menos 6 caracteres.');
                    else if (err.code === 'auth/operation-not-allowed') setError('O cadastro por Email/Senha não está ativado no Firebase.');
                    else setError(isRegistering ? `Erro ao criar conta: ${err.message}` : `Acesso negado: Verifique os seus dados.`); 
                } 
                finally { setIsLoading(false); }
            };

            const handleGoogleLogin = async () => {
                setIsGoogleLoading(true); setError('');
                try { await loginWithGoogle(); } 
                catch (err) { setError('Erro no login com Google. Verifique a consola do Firebase.'); } 
                finally { setIsGoogleLoading(false); }
            };

            return (
                <div className="min-h-screen bg-[#050508] flex items-center justify-center relative overflow-hidden">
                    <div className="absolute w-[60vw] h-[60vw] rounded-full bg-cyan-900/20 blur-[150px] pointer-events-none"></div>
                    <Card className="w-full max-w-md p-8 relative z-10" glowColor="cyan">
                        <div className="text-center mb-8">
                            <Icon name="Truck" size={48} className="text-cyan-500 mx-auto mb-4" />
                            <h1 className="text-3xl font-black text-white tracking-tighter uppercase">NovaLogis</h1>
                            <p className="text-slate-400 text-sm tracking-widest mt-1">{isRegistering ? 'CRIAR CONTA' : 'LOGÍSTICA E CONTROLO'}</p>
                        </div>
                        {error && <div className="bg-rose-500/10 text-rose-400 border border-rose-500/50 p-3 rounded-lg text-sm mb-6 flex items-center"><Icon name="AlertTriangle" size={16} className="mr-2"/>{error}</div>}
                        
                        <form onSubmit={handleAuth} className="space-y-5">
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Email</label>
                                <div className="relative">
                                    <Icon name="UserIcon" size={18} className="absolute left-3 top-3 text-slate-500" />
                                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-[#0a0b10] border border-white/10 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-cyan-500 text-white" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Senha</label>
                                <div className="relative">
                                    <Icon name="Lock" size={18} className="absolute left-3 top-3 text-slate-500" />
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-[#0a0b10] border border-white/10 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-cyan-500 text-white" required minLength="6" />
                                </div>
                            </div>
                            {isRegistering && (
                                <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                                    <label className="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Confirmar Senha</label>
                                    <div className="relative">
                                        <Icon name="Lock" size={18} className="absolute left-3 top-3 text-slate-500" />
                                        <input type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} className="w-full bg-[#0a0b10] border border-white/10 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-cyan-500 text-white" required minLength="6" />
                                    </div>
                                </div>
                            )}
                            <Button variant="cyan" type="submit" className="w-full py-3 mt-2" isLoading={isLoading}>
                                {isRegistering ? 'CRIAR CONTA SEGURA' : 'ENTRAR NO SISTEMA'}
                            </Button>
                        </form>

                        <div className="mt-4 text-center">
                            <button type="button" onClick={() => { setIsRegistering(!isRegistering); setError(''); setConfirmPassword(''); }} className="text-sm text-cyan-500 hover:text-cyan-400 transition-colors">
                                {isRegistering ? 'Já tenho uma conta. Fazer Login' : 'Não tem conta? Criar agora'}
                            </button>
                        </div>

                        <div className="mt-6 flex items-center justify-between">
                            <span className="w-1/4 border-b border-white/10"></span>
                            <span className="text-xs text-slate-500 uppercase font-medium">ou</span>
                            <span className="w-1/4 border-b border-white/10"></span>
                        </div>

                        <Button type="button" variant="secondary" className="w-full mt-6 py-3 border-white/10 hover:border-white/20 hover:bg-white/5 flex items-center justify-center gap-3 transition-all" onClick={handleGoogleLogin} isLoading={isGoogleLoading}>
                            {!isGoogleLoading && (
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                                </svg>
                            )}
                            Continuar com Google
                        </Button>
                    </Card>
                </div>
            );
        };

        // === APLICAÇÃO PRINCIPAL ===
        const MainApp = () => {
            const { logout, user, isAdmin, enableAdmin, disableAdmin } = useContext(AuthContext);
            const [view, setView] = useState('dashboard');
            
            const [licenses, setLicenses] = useState([]);
            const [movements, setMovements] = useState([]);
            const [auditLogs, setAuditLogs] = useState([]);

            // Modal Estados CRUD
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('');
            const [modalMode, setModalMode] = useState('create');
            const [formData, setFormData] = useState({});
            const [isSaving, setIsSaving] = useState(false);
            
            // Upload Estados Cloudinary
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploadProgress, setUploadProgress] = useState(0);

            // Modal Estado ADMIN
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminPwdInput, setAdminPwdInput] = useState('');
            const [adminError, setAdminError] = useState('');

            // Obter Dados em Tempo Real (Firestore continua o mesmo)
            useEffect(() => {
                const unsubLic = db.collection("licenses").onSnapshot(snap => setLicenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubMov = db.collection("movements").orderBy("dateOut", "desc").onSnapshot(snap => setMovements(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubAudit = db.collection("audit_logs").orderBy("timestamp", "desc").limit(50).onSnapshot(snap => setAuditLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubLic(); unsubMov(); unsubAudit(); };
            }, []);

            // FUNÇÃO DESBLOQUEIO DE ADMIN
            const handleUnlockAdmin = (e) => {
                e.preventDefault();
                if(enableAdmin(adminPwdInput)) {
                    setShowAdminModal(false);
                    setAdminPwdInput('');
                    setAdminError('');
                } else {
                    setAdminError('Senha mestra incorreta.');
                }
            };

            // FUNÇÃO DE AUDITORIA (RASTREABILIDADE)
            const logAction = async (module, action, docName, details) => {
                try {
                    await db.collection("audit_logs").add({
                        module, action, docName, details,
                        user: user.email || 'Usuário Google',
                        timestamp: new Date().toISOString(),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (e) { console.error("Erro Rastreabilidade", e); }
            };

            // INTELIGÊNCIA LICENÇAS
            const processedLicenses = licenses.map(lic => {
                if(!lic.expireDate) return { ...lic, diasRestantes: 0, badgeType: 'default', statusTxt: 'N/A', limitDateTxt: 'N/A' };
                const diffVencimento = Math.ceil((new Date(lic.expireDate) - new Date()) / (1000 * 60 * 60 * 24));
                const limitDate = new Date(lic.expireDate);
                const diasRenovacao = parseInt(lic.renewalDays) || 30;
                limitDate.setDate(limitDate.getDate() - diasRenovacao);
                const diffLimite = Math.ceil((limitDate - new Date()) / (1000 * 60 * 60 * 24));

                let badgeType = 'success', statusTxt = 'Regular';
                if (diffVencimento < 0) { badgeType = 'danger'; statusTxt = 'Vencida'; }
                else if (diffLimite <= 0) { badgeType = 'warning'; statusTxt = 'Atenção (Processo)'; }
                
                return { ...lic, diasRestantes: diffVencimento, limitDateTxt: limitDate.toLocaleDateString('pt-BR'), badgeType, statusTxt };
            });

            // ESTATÍSTICAS LOGÍSTICA
            const totalRetirada = movements.reduce((acc, curr) => acc + (parseInt(curr.quantityOut) || 0), 0);
            const totalDevolvida = movements.reduce((acc, curr) => acc + (parseInt(curr.quantityIn) || 0), 0);

            // FUNÇÕES DE EXPORTAÇÃO (PDF / EXCEL)
            const handleExportPDF = (type) => {
                const doc = new window.jspdf.jsPDF();
                if (type === 'licenses') {
                    doc.text("NovaLogis - Relatório de Licenças", 14, 15);
                    const columns = ["Documento", "Órgão", "Vencimento", "Data Início Proc.", "Status"];
                    const data = processedLicenses.map(lic => [
                        lic.name, lic.agency, 
                        lic.expireDate ? new Date(lic.expireDate).toLocaleDateString('pt-BR') : 'N/A', 
                        lic.limitDateTxt, lic.statusTxt
                    ]);
                    doc.autoTable({ head: [columns], body: data, startY: 20, theme: 'grid' });
                    doc.save("NovaLogis_Licencas.pdf");
                } else {
                    doc.text("NovaLogis - Logística (Frascos e Equipamentos)", 14, 15);
                    const columns = ["Cliente", "Tipo", "Retirada (Qtd/Data)", "Devolução (Qtd/Data)", "Saldo Pendente"];
                    const data = movements.map(mov => [
                        mov.client, mov.type, 
                        `${mov.quantityOut} un. em ${new Date(mov.dateOut).toLocaleDateString('pt-BR')}`, 
                        mov.quantityIn ? `${mov.quantityIn} un. em ${new Date(mov.dateIn).toLocaleDateString('pt-BR')}` : 'Pendente',
                        (mov.quantityOut - (mov.quantityIn || 0)).toString()
                    ]);
                    doc.autoTable({ head: [columns], body: data, startY: 20, theme: 'grid' });
                    doc.save("NovaLogis_Logistica.pdf");
                }
            };

            const handleExportExcel = (type) => {
                let data = [];
                let fileName = "";
                if (type === 'licenses') {
                    fileName = "NovaLogis_Licencas.xlsx";
                    data = processedLicenses.map(lic => ({
                        "Documento": lic.name, "Número": lic.number, "Órgão": lic.agency,
                        "Vencimento": lic.expireDate ? new Date(lic.expireDate).toLocaleDateString('pt-BR') : 'N/A',
                        "Dias Antecedência Exigidos": lic.renewalDays, "Data Limite Início Processo": lic.limitDateTxt, "Status": lic.statusTxt
                    }));
                } else {
                    fileName = "NovaLogis_Logistica.xlsx";
                    data = movements.map(mov => ({
                        "Cliente": mov.client, "Tipo do Item": mov.type,
                        "Qtd Retirada": mov.quantityOut, "Data Retirada": new Date(mov.dateOut).toLocaleDateString('pt-BR'),
                        "Qtd Devolvida": mov.quantityIn || 0, "Data Retorno": mov.dateIn ? new Date(mov.dateIn).toLocaleDateString('pt-BR') : 'N/A',
                        "Saldo Pendente": mov.quantityOut - (mov.quantityIn || 0)
                    }));
                }
                const ws = window.XLSX.utils.json_to_sheet(data);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Relatorio");
                window.XLSX.writeFile(wb, fileName);
            };

            // CRUD HANDLERS
            const openModal = (type, mode = 'create', data = null) => {
                setModalType(type); setModalMode(mode);
                setSelectedFile(null);
                setUploadProgress(0);
                if (mode === 'edit' && data) setFormData(data);
                else setFormData(type === 'license' 
                    ? { name: '', number: '', agency: '', expireDate: '', renewalDays: 30, docsList: [''] }
                    : { client: '', type: '', quantityOut: 1, dateOut: new Date().toISOString().split('T')[0], quantityIn: 0, dateIn: '' }
                );
                setIsModalOpen(true);
            };

            const handleSave = async () => {
                setIsSaving(true);
                try {
                    let currentFileUrl = formData.fileUrl || null;
                    let currentFileName = formData.fileName || null;

                    // UPLOAD PARA O CLOUDINARY (Substitui o Firebase Storage)
                    if (selectedFile && modalType === 'license') {
                        const cloudName = 'dssjfq5lj';
                        const uploadPreset = 'novalogis_uploads';
                        const url = `https://api.cloudinary.com/v1_1/${cloudName}/upload`;

                        const fd = new FormData();
                        fd.append('file', selectedFile);
                        fd.append('upload_preset', uploadPreset);

                        await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', url, true);
                            
                            xhr.upload.onprogress = (e) => {
                                if (e.lengthComputable) {
                                    const progress = (e.loaded / e.total) * 100;
                                    setUploadProgress(progress);
                                }
                            };
                            
                            xhr.onload = () => {
                                if (xhr.status === 200) {
                                    const response = JSON.parse(xhr.responseText);
                                    currentFileUrl = response.secure_url;
                                    currentFileName = selectedFile.name;
                                    resolve();
                                } else {
                                    reject(new Error('Erro no envio do arquivo.'));
                                }
                            };
                            
                            xhr.onerror = () => reject(new Error('Erro de rede no envio.'));
                            xhr.send(fd);
                        });
                    }

                    const finalData = { ...formData };
                    if (modalType === 'license') {
                        finalData.fileUrl = currentFileUrl;
                        finalData.fileName = currentFileName;
                    }

                    const collection = modalType === 'license' ? 'licenses' : 'movements';
                    const docName = modalType === 'license' ? formData.name : formData.client;

                    if (modalMode === 'create') {
                        await db.collection(collection).add({ ...finalData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                        await logAction(modalType, 'CRIOU', docName, `Novo registro adicionado.`);
                    } else {
                        const { id, ...updateData } = finalData;
                        await db.collection(collection).doc(id).update({ ...updateData, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                        await logAction(modalType, 'EDITOU', docName, `Registro modificado.`);
                    }
                    setIsModalOpen(false);
                    setSelectedFile(null);
                    setUploadProgress(0);
                } catch (e) { 
                    console.error(e);
                    alert("Erro ao salvar! " + e.message); 
                } 
                finally { setIsSaving(false); }
            };

            const handleDelete = async (type, id, name) => {
                if(!isAdmin) return alert("Apenas administradores podem excluir.");
                if(window.confirm(`Tem certeza que deseja excluir permanentemente [${name}]? Esta ação não pode ser desfeita.`)) {
                    try {
                        const collection = type === 'license' ? 'licenses' : 'movements';
                        await db.collection(collection).doc(id).delete();
                        await logAction(type, 'ELIMINOU', name, `Registro excluído permanentemente.`);
                    } catch(e) { alert("Erro ao excluir."); }
                }
            };

            // Helpers Formulário Licença
            const updateDocItem = (index, value) => {
                const newDocs = [...(formData.docsList || [])]; newDocs[index] = value; setFormData({...formData, docsList: newDocs});
            };
            const addDocItem = () => setFormData({...formData, docsList: [...(formData.docsList || []), '']});
            const removeDocItem = (index) => setFormData({...formData, docsList: formData.docsList.filter((_, i) => i !== index)});

            return (
                <div className="flex h-screen overflow-hidden">

                                <h1 className="text-2xl font-black tracking-tighter uppercase">NovaLogis</h1>
                            </div>
                        </div>

                            <button onClick={()=>setView('licenses')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${view==='licenses'?'bg-purple-500/10 text-purple-400 shadow-[inset_2px_0_0_#a855f7]':'text-slate-400 hover:bg-white/5'}`}><Icon name="ShieldAlert"/> Licenças</button>
                            <button onClick={()=>setView('containers')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${view==='containers'?'bg-cyan-500/10 text-cyan-400 shadow-[inset_2px_0_0_#06b6d4]':'text-slate-400 hover:bg-white/5'}`}><Icon name="Activity"/> Logística</button>
                            <button onClick={()=>setView('audit')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${view==='audit'?'bg-rose-500/10 text-rose-400 shadow-[inset_2px_0_0_#f43f5e]':'text-slate-400 hover:bg-white/5'}`}><Icon name="History"/> Histórico (Auditoria)</button>
                        </nav>

                            <button onClick={logout} className="w-full flex items-center gap-3 px-4 py-2 text-sm text-slate-400 hover:text-rose-400"><Icon name="LogOut"/> Sair</button>

                                {view === 'dashboard' ? 'Painel Central' : view === 'licenses' ? 'Gestão de Licenças' : view === 'containers' ? 'Controlo Logístico' : 'Rastreabilidade e Logs'}
                            </h2>
                            <div className="flex items-center gap-4">
                                
                                {/* BOTÃO DE ATIVAÇÃO ADMIN */}

                                    <button onClick={disableAdmin} className="flex items-center gap-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-500/30 transition-colors shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                                        <Icon name="Unlock" size={14}/> ADMIN ATIVO
                                    </button>

                                        <Icon name="Lock" size={14}/> MODO ADMIN
                                    </button>

                                <div className="h-6 w-px bg-white/10 mx-2"></div>

                                                                    <Icon name="ExternalLink" size={12} className="mr-1"/> Ver Anexo
                                                                </a>
                                                            )}
                                                            
                                                            {lic.docsList && lic.docsList.length > 0 && lic.docsList[0] !== "" && (
                                                                <p className="text-[10px] text-cyan-500 mt-1">{lic.docsList.length} doc(s) exigidos na lista</p>
                                                            )}
                                                        </td>
                                                        <td className="p-4 text-slate-300 text-sm">{lic.agency}</td>
                                                        <td className="p-4 text-slate-300 text-sm">{lic.expireDate ? new Date(lic.expireDate).toLocaleDateString('pt-BR') : 'N/A'}</td>
                                                        <td className="p-4 font-bold text-amber-400 text-sm">{lic.limitDateTxt} <span className="text-[10px] text-slate-500 font-normal block">({lic.renewalDays} dias antes)</span></td>

                                            <div className="flex-1">
                                                <label className="text-[10px] text-slate-400 mb-1 block uppercase">Data Vencimento</label>
                                                <input type="date" value={formData.expireDate} onChange={e=>setFormData({...formData, expireDate:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 outline-none" />
                                            </div>
                                            <div className="w-1/3">
                                                <label className="text-[10px] text-slate-400 mb-1 block uppercase">Avisar Antes (Dias)</label>
                                                <input type="number" placeholder="Dias" value={formData.renewalDays} onChange={e=>setFormData({...formData, renewalDays:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 outline-none" />
                                            </div>
                                        </div>

                                        {/* UPLOAD CLOUDINARY */}
                                        <div className="mt-4 pt-4 border-t border-white/10">
                                            <label className="text-xs text-slate-400 mb-2 block uppercase font-bold text-purple-500 flex items-center"><Icon name="Paperclip" size={14} className="mr-1"/> Anexar Certificado (PDF/Imagem)</label>
                                            <input type="file" accept=".pdf,image/*" onChange={(e) => setSelectedFile(e.target.files[0])} className="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-500/20 file:text-purple-400 hover:file:bg-purple-500/30 cursor-pointer" />
                                            
                                            {formData.fileUrl && !selectedFile && (
                                                <div className="mt-2 text-xs text-emerald-400 flex items-center">
                                                    <Icon name="CheckCircle2" size={14} className="mr-1"/> Arquivo anexado: {formData.fileName}
                                                </div>
                                            )}
                                            
                                            {uploadProgress > 0 && uploadProgress < 100 && (
                                                <div className="w-full bg-slate-800 rounded-full h-1.5 mt-2">
                                                    <div className="bg-purple-500 h-1.5 rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="mt-4 pt-4 border-t border-white/10">
                                            <label className="text-xs text-slate-400 mb-2 block uppercase font-bold text-cyan-500">Documentos Exigidos para Renovação</label>
                                            {(formData.docsList || []).map((docItem, idx) => (
                                                <div key={idx} className="flex gap-2 mb-2">
                                                    <input type="text" placeholder="Nome do documento (Ex: Cópia CNPJ)" value={docItem} onChange={e => updateDocItem(idx, e.target.value)} className="flex-1 bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none" />
                                                    <button type="button" onClick={() => removeDocItem(idx)} className="p-2 bg-rose-500/10 text-rose-400 rounded-lg hover:bg-rose-500/20"><Icon name="XCircle" size={16}/></button>
                                                </div>
                                            ))}
                                            <button type="button" onClick={addDocItem} className="text-xs text-cyan-400 hover:text-cyan-300 flex items-center mt-2"><Icon name="Plus" size={14} className="mr-1"/> Adicionar novo documento à lista</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <input type="text" placeholder="Nome do Cliente/Destino" value={formData.client} onChange={e=>setFormData({...formData, client:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-white focus:border-cyan-500 outline-none" disabled={modalMode === 'edit'} />
                                        <input type="text" placeholder="Tipo do Item (Ex: Frasco 1L, Palete)" value={formData.type} onChange={e=>setFormData({...formData, type:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-white focus:border-cyan-500 outline-none" disabled={modalMode === 'edit'} />
                                        
                                        <div className="p-3 border border-white/10 rounded-lg bg-white/5 mt-4">
                                            <label className="text-xs text-cyan-400 mb-2 block font-bold uppercase">Dados de Saída (Retirada)</label>
                                            <div className="flex gap-4">
                                                <div className="w-1/3">
                                                    <label className="text-[10px] text-slate-400 mb-1 block">Qtd</label>
                                                    <input type="number" value={formData.quantityOut} onChange={e=>setFormData({...formData, quantityOut:Number(e.target.value)})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white outline-none" disabled={modalMode === 'edit'}/>
                                                </div>
                                                <div className="flex-1">
                                                    <label className="text-[10px] text-slate-400 mb-1 block">Data Saída</label>
                                                    <input type="date" value={formData.dateOut} onChange={e=>setFormData({...formData, dateOut:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white outline-none" disabled={modalMode === 'edit'}/>
                                                </div>
                                            </div>
                                        </div>

                                        {modalMode === 'edit' && (
                                            <div className="p-3 border border-purple-500/30 rounded-lg bg-purple-500/5 mt-4">
                                                <label className="text-xs text-purple-400 mb-2 block font-bold uppercase">Dados de Retorno (Devolução)</label>
                                                <div className="flex gap-4">
                                                    <div className="w-1/3">
                                                        <label className="text-[10px] text-slate-400 mb-1 block">Qtd Devolvida</label>
                                                        <input type="number" value={formData.quantityIn} onChange={e=>setFormData({...formData, quantityIn:Number(e.target.value)})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none" />
                                                    </div>
                                                    <div className="flex-1">
                                                        <label className="text-[10px] text-slate-400 mb-1 block">Data Retorno</label>
                                                        <input type="date" value={formData.dateIn} onChange={e=>setFormData({...formData, dateIn:e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none" />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="flex justify-end gap-3 mt-8">
                                    <Button variant="secondary" onClick={()=>setIsModalOpen(false)}>Cancelar</Button>
                                    <Button variant={modalType === 'license' ? 'primary' : 'cyan'} onClick={handleSave} isLoading={isSaving}>
                                        {modalMode === 'create' ? 'Salvar' : 'Atualizar'}
                                    </Button>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AuthProvider>
                <AuthContext.Consumer>
                    {({ uiLoggedIn }) => uiLoggedIn ? <MainApp /> : <LoginScreen />}
                </AuthContext.Consumer>
            </AuthProvider>
        );
    </script>
</body>
</html>
